# Shared by the HTTP and HTTPS server blocks (see select-conf.sh).

root /usr/share/nginx/html;
index index.html;

# The app accepts images up to 2 MB, sent as base64 inside JSON (~2.7 MB on the
# wire). nginx's 1 MB default rejected anything over roughly 750 KB.
client_max_body_size 8m;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# X-Forwarded-For carries the visitor's address to uvicorn (--proxy-headers), so
# rate limits apply per visitor instead of to this container's address.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# SPA fallback — let React Router handle all frontend routes
location / {
    try_files $uri $uri/ /index.html;
}

# ── Main backend (FastAPI, port 8000) ─────────────────────────────────────────
location /auth/   { proxy_pass http://backend:8000; }
location /api/    { proxy_pass http://backend:8000; }
location /health  { proxy_pass http://backend:8000; }
# Uploaded images (stored on the backend's disk)
location /uploads/ { proxy_pass http://backend:8000; }

# ── ML service (FastAPI, port 8001) ───────────────────────────────────────────
location /predict     { proxy_pass http://ml:8001; }
location /cultivation { proxy_pass http://ml:8001; }
location /guidance    { proxy_pass http://ml:8001; }
location /meta        { proxy_pass http://ml:8001; }
location /weather     { proxy_pass http://ml:8001; }
